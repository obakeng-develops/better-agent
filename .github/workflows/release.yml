name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release, for example v0.8.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: astral-sh/setup-uv@v6

      - name: Check the tag matches pyproject.toml
        run: |
          version="v$(uv version --short)"
          if [ "$version" != "$TAG" ]; then
            echo "::error::tag $TAG doesn't match version $version in pyproject.toml"
            exit 1
          fi

      - run: uv run pytest

      - run: uv build

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/* --title "$TAG" --generate-notes --verify-tag
