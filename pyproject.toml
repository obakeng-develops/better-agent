[project]
name = "better-agent"
version = "0.7.1"
description = "Local-first, searchable, linkable history for coding-agent sessions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
bta = "better_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/better_agent"]

[dependency-groups]
dev = ["pytest>=8"]
